# Generated by HyprMod

# Settings
decoration:blur:xray = false
dwindle:smart_split = false
general:border_size = 1
general:layout = dwindle
general:resize_on_border = false
misc:disable_hyprland_logo = false

# Keybinds
bind = SUPER, eacute, workspace, 2
bind = SUPER, ampersand, workspace, 1
bind = SUPER, quotedbl, workspace, 3
bind = SUPER, apostrophe, workspace, 4
bind = SUPER, parenleft, workspace, 5
bind = SUPER, space, exec, noctalia-shell ipc call launcher toggle
bind = SUPER, Z, exec, zen
bind = SUPER, S, exec, noctalia-shell ipc call settings toggle
bind = SUPER, N, exec, noctalia-shell ipc call network togglePanel
bind = SUPER, P, exec, noctalia-shell ipc call sessionMenu toggle
bind = SUPER SHIFT, L, exec, noctalia-shell ipc call lockScreen lock
bind = , Print, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = SHIFT, Print, exec, hyprshot -m window -o ~/Pictures/Screenshots
bind = CTRL, Print, exec, hyprshot -m region -o ~/Pictures/Screenshots
